<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-Cybersecurity</title>
  <link rel="stylesheet" href="../static/style.css" th:href="@{/style.css}">
  <meta property="og:type" content="website">
</head>

<body>
  <header class="header">
    <h1 class="header__title">Web-Cybersecurity</h1>
  </header>

  <main class="main__logIn">
    <form action="/login" method="post" class="form" id="MyForm">
      <h2 class="form__title">Hello, cybersecurity specialist!</h2>

      <div class="form__filed">
        <label class="form__label" for="login">Login</label>
        <input class="form__input" type="text" id="login" name="login"
               autocomplete="username" required>
      </div>

      <div class="form__field">
        <label class="form__label" for="password">Password</label>
        <input class="form__input" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>

      <button class="form__button" type="submit">Log in</button>
      <p class="form__footer">
        No account yet?
      <a class="form__link" href="Registration.html" th:href="@{/register}">Registration</a>
    </form>

  </main>
</body>
</html>
