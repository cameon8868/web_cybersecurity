<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootPath</title>
  <link rel="stylesheet" th:href="@{/style.css}">
  <meta property="og:type" content="website">
</head>

<body>
    <header>
      <h1>Hello, cybersecurity specialist!</h1>
    </header>
    <main>
      <form action="/login" method="post" class="form" id="MyForm">
        <div class="form__filed">
          <label class="form__label" for="login">Login</label>
          <input class="form__input" type ="text" id="login" name="login" required/>
        </div>

        <div>
          <label class="form__label" for="password">Password</label>
          <input class="form__input" type="password" id="password" name="password" required/>
        </div>
      
        <button class="form__button">Registration</button>
      </form>
    </main>
    <p id="message" class="message">Form submitted successfully!</p>
</body>
</html>
